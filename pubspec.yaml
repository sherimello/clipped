name: clipped
description: A beautiful, offline-first clipboard manager for Windows.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Window management & effects
  window_manager: ^0.3.9
  flutter_acrylic: ^1.1.2

  # Global hotkeys
  hotkey_manager: ^0.2.3

  # System tray (local override to fix Cancel button in context menu)
  system_tray:
    path: packages/system_tray

  # Clipboard monitoring
  clipboard_watcher: ^0.2.0

  # State management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Storage & file system
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Utilities
  uuid: any
  intl: ^0.19.0
  image: ^4.2.0

  # Win32 API (Windows clipboard image reading, paste simulation)
  win32: ^5.5.4
  ffi: ^2.1.0

  cupertino_icons: ^1.0.8
  msix: ^3.16.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tray_icon.ico
    - assets/images/

msix_config:
  display_name: Clipped
  publisher_display_name: Thabat Inc.
  identity_name: thabtat.clipped
  msix_version: 1.0.0.0
  logo_path: assets/images/clipped logo.png
  capabilities: clipboardReadWrite